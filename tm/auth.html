<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — TechMagpies</title>

<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b1a3e;--night:#071230;--blue:#1f6ff2;--sky:#18b4ff;--line:#d6e3f6;--muted:#566a90;--f-d:"Bricolage Grotesque","Inter Display","Inter",system-ui,sans-serif;--f-b:"Manrope","Inter",system-ui,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--f-b);background:#fff;color:#17254a;-webkit-font-smoothing:antialiased}
.container{display:grid;grid-template-columns:1fr 1fr;min-height:100vh;min-height:100dvh}
.left{position:relative;overflow:hidden;background:radial-gradient(600px 400px at 85% 10%,rgba(24,180,255,.3),transparent 62%),radial-gradient(500px 360px at 0% 100%,rgba(31,111,242,.35),transparent 60%),var(--night);color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(28px,5vw,64px)}
.left::before{content:"";position:absolute;width:680px;height:400px;right:-220px;bottom:-120px;border-radius:50%;border:2px dashed rgba(127,214,255,.3);transform:rotate(-12deg)}
.left img{width:190px;height:auto;position:relative;margin:-10px 0 0 -10px}
.left-content{position:relative;max-width:440px}
.left h1{font-family:var(--f-d);font-size:clamp(2.2rem,4.4vw,3.6rem);line-height:1;letter-spacing:-.04em;font-weight:800;margin-bottom:16px}
.left p{color:#a9bbdd;font-size:18px}
.left .back{position:relative;color:#7fd6ff;font-weight:700;text-decoration:none;font-size:15px}
.left .back:hover{text-decoration:underline}
.right{display:flex;align-items:center;justify-content:center;padding:clamp(24px,5vw,64px)}
.form-box{width:100%;max-width:400px}
.form-box h2{font-family:var(--f-d);font-size:2.2rem;letter-spacing:-.03em;color:var(--ink);margin-bottom:22px}
input{width:100%;padding:14px;margin-bottom:14px;border-radius:12px;border:1.5px solid var(--line);font:inherit;color:#17254a;transition:border-color .15s,box-shadow .15s}
input:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 4px rgba(31,111,242,.14)}
.btn{width:100%;height:50px;background:var(--ink);color:#fff;border:none;border-radius:12px;cursor:pointer;font:800 15px var(--f-b);box-shadow:0 10px 22px -10px rgba(11,26,62,.7);transition:background-color .15s,transform .15s}
.btn:hover{background:var(--blue);transform:translateY(-2px)}
.switch{margin-top:16px;font-size:15px;color:var(--muted)}
.switch a{color:var(--blue);cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-weight:700}
.hidden{display:none}
@media (max-width:900px){.container{grid-template-columns:1fr}.left{min-height:0;gap:36px}.left::before{display:none}.left img{width:150px}.right{align-items:flex-start}}
</style>
</head>

<body>

<div class="container">

  <!-- LEFT -->
  <div class="left">
    <a href="index.html" aria-label="TechMagpies home"><img src="assets/img/techmagpies-logo-light.png" alt="TechMagpies" width="190" height="110"></a>
    <div class="left-content">
      <h1 id="title">Welcome Back 👋</h1>
      <p id="subtitle">Login to continue your journey</p>
    </div>
    <a class="back" href="index.html">&larr; Back to home</a>
  </div>

  <!-- RIGHT -->
  <div class="right">
    <div class="form-box">

      <!-- LOGIN -->
      <form id="loginForm">
        <h2>Login</h2>

        <input type="email" id="loginEmail" placeholder="Email" required>
        <input type="password" id="loginPassword" placeholder="Password" required>

        <button class="btn">Login</button>

        <p class="switch">
          Don't have an account? <a onclick="showSignup()">Sign up</a>
        </p>
      </form>

      <!-- SIGNUP -->
      <form id="signupForm" class="hidden">
        <h2>Sign Up</h2>

        <input type="text" id="signupName" placeholder="Full Name" required>
        <input type="email" id="signupEmail" placeholder="Email" required>
        <input type="password" id="signupPassword" placeholder="Password" required>

        <button class="btn">Sign Up</button>

        <p class="switch">
          Already have an account? <a onclick="showLogin()">Login</a>
        </p>
      </form>

    </div>
  </div>

</div>

<script>
// SWITCH UI
function showSignup() {
  document.getElementById("loginForm").classList.add("hidden");
  document.getElementById("signupForm").classList.remove("hidden");

  document.getElementById("title").innerText = "Join Us 🚀";
  document.getElementById("subtitle").innerText = "Create your account and start learning";
}

function showLogin() {
  document.getElementById("signupForm").classList.add("hidden");
  document.getElementById("loginForm").classList.remove("hidden");

  document.getElementById("title").innerText = "Welcome Back 👋";
  document.getElementById("subtitle").innerText = "Login to continue your journey";
}

// SIGNUP
document.getElementById("signupForm").addEventListener("submit", function(e){
  e.preventDefault();

  const name = document.getElementById("signupName").value;
  const email = document.getElementById("signupEmail").value;
  const password = document.getElementById("signupPassword").value;

  const user = { name, email, password };

  localStorage.setItem("user", JSON.stringify(user));

  alert("Signup successful! Please login.");
  showLogin();
});

// LOGIN
document.getElementById("loginForm").addEventListener("submit", function(e){
  e.preventDefault();

  const email = document.getElementById("loginEmail").value;
  const password = document.getElementById("loginPassword").value;

  const storedUser = JSON.parse(localStorage.getItem("user"));

  if (storedUser && storedUser.email === email && storedUser.password === password) {
    
    // ✅ STORE LOGGED USER
    localStorage.setItem("loggedInUser", JSON.stringify(storedUser));

    // ✅ REDIRECT
    window.location.href = "index.html";

  } else {
    alert("Invalid email or password");
  }
});
</script>

</body>
</html>
